
name: CRM Frontend CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:

  # STAGE 1 - BUILD
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare standalone deployment ZIP
        run: |
          mkdir deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then
            cp -r public deploy/
          fi
          test -f deploy/server.js
          cd deploy
          zip -qr ../frontend.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: frontend.zip

  # STAGE 2 - DEV
  DEV:
    needs: Build
    runs-on: ubuntu-latest
    environment: DEV-ENVIRONMENT

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start DEV Frontend
        run: az webapp start -g DEV-RESOURCEGROUP -n dev-frontendapp-crm

      - name: Deploy DEV Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: dev-frontendapp-crm
          package: frontend.zip

      - name: Verify DEV Frontend
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -L --max-time 15 -o /dev/null -w "%{http_code}" https://dev-frontendapp-crm.azurewebsites.net/ || true)
            echo "HTTP Status: $STATUS"

            if [[ "$STATUS" == "200" ]]; then
              echo "DEV Frontend is running successfully"
              exit 0
            fi

            sleep 10
          done

          echo "DEV Frontend verification failed"
          exit 1

  # STAGE 3 - UAT
  UAT:
    needs: DEV
    runs-on: ubuntu-latest
    environment: UAT-ENVIRONMENT

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start UAT Frontend
        run: az webapp start -g UAT-RESOURCEGROUP -n uat-frontendapp-crm

      - name: Deploy UAT Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: uat-frontendapp-crm
          package: frontend.zip

      - name: Verify UAT Frontend
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -L --max-time 15 -o /dev/null -w "%{http_code}" https://uat-frontendapp-crm.azurewebsites.net/ || true)
            echo "HTTP Status: $STATUS"

            if [[ "$STATUS" == "200" ]]; then
              echo "UAT Frontend is running successfully"
              exit 0
            fi

            sleep 10
          done

          echo "UAT Frontend verification failed"
          exit 1

  # STAGE 4 - PROD
  PROD:
    needs: UAT
    runs-on: ubuntu-latest
    environment: PROD-ENVIRONMENT

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start PROD Frontend
        run: az webapp start -g PROD-RESOURCEGROUP -n prod-frontendapp-crm

      - name: Deploy PROD Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: prod-frontendapp-crm
          package: frontend.zip

      - name: Verify PROD Frontend
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -L --max-time 15 -o /dev/null -w "%{http_code}" https://prod-frontendapp-crm.azurewebsites.net/ || true)
            echo "HTTP Status: $STATUS"

            if [[ "$STATUS" == "200" ]]; then
              echo "PROD Frontend is running successfully"
              exit 0
            fi

            sleep 10
          done

          echo "PROD Frontend verification failed"
          exit 1
